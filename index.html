<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mesa no quarto – teste em RA</title>
<style>
:root{--bg:#e9edf1;--panel:#ffffff;--ink:#1b2430;--muted:#5b6776;--line:#d3d9e0;--accent:#f2b705;--ok:#1f9d55;--bad:#d9382c;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171c22;--panel:#222a33;--ink:#eef2f6;--muted:#9aa6b4;--line:#38424e;--ok:#4cc37f;--bad:#ff6b5e}}
:root[data-theme="dark"]{--bg:#171c22;--panel:#222a33;--ink:#eef2f6;--muted:#9aa6b4;--line:#38424e;--ok:#4cc37f;--bad:#ff6b5e}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block;z-index:1}
.live{display:none}
body.run .live{display:flex}
body.run .idle{display:none}
#ui{position:fixed;z-index:2;inset:0;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between}
#ui>*{pointer-events:auto}
#top{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:calc(10px + env(safe-area-inset-top,0px)) 12px 0}
#verdict{flex:1;background:var(--panel);border-left:6px solid var(--ok);border-radius:10px;padding:8px 12px;box-shadow:0 2px 10px rgba(0,0,0,.18)}
#verdict.bad{border-color:var(--bad)}
#verdict b{display:block;font-size:16px}
#verdict small{color:var(--muted);display:block}
#bottom{background:var(--panel);border-radius:16px 16px 0 0;padding:8px 14px calc(12px + env(safe-area-inset-bottom,0px));box-shadow:0 -2px 12px rgba(0,0,0,.2);max-height:55%;overflow-y:auto}
.row{display:flex;gap:8px;margin:6px 0}
button{flex:1;font:inherit;font-weight:600;padding:11px 10px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink)}
button.primary{background:var(--accent);border-color:var(--accent);color:#1b2430}
button:disabled{opacity:.5}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h3{margin:10px 0 2px;font-size:13px;color:var(--muted);font-weight:600}
label{display:grid;grid-template-columns:118px 1fr 58px;align-items:center;gap:8px;font-size:14px}
label output{text-align:right;font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--accent)}
#status{font-size:13px;color:var(--muted);margin:4px 0}
#panel.collapsed .sliders{display:none}
</style>
</head>
<body>
<div id="ui">
  <div id="top"><div id="verdict"><b id="v1"></b><small id="v2"></small><small id="v3"></small></div></div>
  <div id="bottom">
    <div class="row idle"><button id="arBtn" class="primary">Iniciar RA no meu quarto</button></div>
    <div class="row">
      <button id="fitBtn">Ajustar mesa à cadeira</button>
      <button id="tranBtn">Tampo transparente</button>
    </div>
    <div class="row live"><button id="exitBtn">Sair da RA</button></div>
    <div id="status"></div>
    <div id="panel" class="collapsed">
      <button id="toggle" style="width:100%;margin-bottom:4px">Medidas (cm) ▾</button>
      <div class="sliders" id="sliders"></div>
    </div>
  </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ---------- Medidas (cm) ----------
const P = {h:75, t:3, w:100, d:55, ah:70, cw:60, push:0, rot:0};
const GROUPS = [
  ['Mesa', [['h','Altura do tampo',55,95,1],['t','Espessura do tampo',1,8,0.5],['w','Largura',50,180,5],['d','Profundidade',30,90,5]]],
  ['Cadeira (braços)', [['ah','Altura do braço',50,90,1],['cw','Largura total',40,80,1],['push','Empurrar p/ mesa',0,50,1]]],
  ['Posição', [['rot','Girar a mesa',0,360,5]]]
];
const $ = id => document.getElementById(id);
const ui = $('ui'), status = $('status');

// ---------- Cena ----------
const renderer = new THREE.WebGLRenderer({antialias:true, alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth, innerHeight);
renderer.xr.enabled = true;
document.body.prepend(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.05, 30);
scene.add(new THREE.HemisphereLight(0xffffff, 0x8a8f99, 0.9));
const sun = new THREE.DirectionalLight(0xffffff, 0.6); sun.position.set(1,3,2); scene.add(sun);
const grid = new THREE.GridHelper(4, 40, 0x8a94a3, 0xb9c1cc); scene.add(grid);
const root = new THREE.Group(); scene.add(root);
const model = new THREE.Group(); root.add(model);

const woodMat = new THREE.MeshStandardMaterial({color:0xc9a26b, roughness:.7});
const legMat = new THREE.MeshStandardMaterial({color:0x6b4f2a, roughness:.8});
const okMat = new THREE.MeshStandardMaterial({color:0x2f7df6, transparent:true, opacity:.72});
const badMat = new THREE.MeshStandardMaterial({color:0xe5372b, transparent:true, opacity:.8});

function box(w,h,d,x,y,z,mat){
  const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), mat);
  m.position.set(x,y,z); model.add(m); return m;
}

// ---------- Cálculo (o "cérebro" do protótipo) ----------
function analyze(){
  const under = P.h - P.t;              // vão livre sob o tampo
  const clear = under - P.ah;           // folga entre topo do braço e tampo
  const gap = P.w - 12;                 // vão entre pernas (pernas de 4 cm + recuo de 2 cm)
  const heightBad = clear < 1;
  const widthBad = P.cw > gap;
  return {under, clear, gap, heightBad, widthBad, bad: heightBad || widthBad, minH: P.ah + P.t + 1};
}

// ---------- Construção do modelo (metros) ----------
function rebuild(){
  model.traverse(o=>{ if(o.geometry) o.geometry.dispose(); });
  model.clear();
  const h=P.h/100, t=P.t/100, w=P.w/100, d=P.d/100, ah=P.ah/100, cw=P.cw/100;
  // mesa
  box(w,t,d, 0,h-t/2,0, woodMat);
  const lx=w/2-0.04, lz=d/2-0.04;
  [[-1,-1],[1,-1],[-1,1],[1,1]].forEach(([sx,sz])=> box(0.04,h-t,0.04, sx*lx,(h-t)/2,sz*lz, legMat));
  // cadeira fantasma (só os braços, assento e encosto de referência)
  const a = analyze(), mat = a.bad ? badMat : okMat;
  const front = d/2 - P.push/100, armLen = 0.30;
  [-1,1].forEach(s=>{
    const x = s*(cw/2-0.03);
    box(0.06,0.03,armLen, x,ah-0.015,front+armLen/2, mat);          // braço
    box(0.03,ah-0.45,0.03, x,0.45+(ah-0.45)/2,front+armLen-0.03, mat); // apoio do braço
  });
  box(cw-0.06,0.06,0.45, 0,0.45,front+0.05+0.225, mat);              // assento
  box(cw-0.06,0.5,0.05, 0,0.45+0.25,front+0.5, mat);                 // encosto
  root.rotation.y = P.rot*Math.PI/180;
  updateVerdict(a);
}

function updateVerdict(a){
  const v = $('verdict');
  v.classList.toggle('bad', a.bad);
  $('v1').textContent = a.bad ? '❌ Os braços da cadeira batem na mesa' : '✅ Os braços passam por baixo da mesa';
  $('v2').textContent = `Vão sob o tampo ${a.under.toFixed(1)} cm · braço ${P.ah} cm · folga ${a.clear.toFixed(1)} cm`;
  let s3 = '';
  if(a.heightBad) s3 = `Para passar, a mesa precisa de pelo menos ${Math.ceil(a.minH)} cm de altura.`;
  if(a.widthBad) s3 += (s3?' ':'') + `A cadeira (${P.cw} cm) não cabe entre as pernas (${a.gap} cm).`;
  $('v3').textContent = s3;
}

// ---------- Controles ----------
GROUPS.forEach(([title, items])=>{
  const h = document.createElement('h3'); h.textContent = title; $('sliders').append(h);
  items.forEach(([id,label,min,max,step])=>{
    const l = document.createElement('label');
    l.innerHTML = `<span>${label}</span><input type="range" min="${min}" max="${max}" step="${step}" value="${P[id]}"><output></output>`;
    const inp = l.querySelector('input'), out = l.querySelector('output');
    const show = ()=> out.textContent = (+inp.value) + (id==='rot' ? '°' : ' cm');
    inp.addEventListener('input', ()=>{ P[id] = +inp.value; show(); rebuild(); });
    inp.dataset.id = id; show(); $('sliders').append(l);
  });
});
$('toggle').onclick = ()=>{ const c = $('panel').classList.toggle('collapsed'); $('toggle').textContent = c ? 'Medidas (cm) ▾' : 'Medidas (cm) ▴'; };
$('fitBtn').onclick = ()=>{
  P.h = Math.min(95, Math.ceil(analyze().minH));
  const inp = document.querySelector('input[data-id="h"]'); inp.value = P.h;
  inp.dispatchEvent(new Event('input'));
};
ui.addEventListener('beforexrselect', e=> e.preventDefault()); // toques na interface não posicionam a mesa

// ---------- Câmera 3D (fora da RA): arrastar gira, pinça/rolagem dá zoom ----------
const orbit = {az:0.7, el:0.35, dist:2.6, target:new THREE.Vector3(0,0.4,0.2)};
function placeCamera(){
  const {az,el,dist,target}=orbit;
  camera.position.set(target.x+dist*Math.cos(el)*Math.sin(az), target.y+dist*Math.sin(el), target.z+dist*Math.cos(el)*Math.cos(az));
  camera.lookAt(target);
}
const ptrs = new Map(); let lastPinch = 0;
const cv = renderer.domElement;
cv.addEventListener('pointerdown', e=>{ cv.setPointerCapture(e.pointerId); ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY}); });
cv.addEventListener('pointerup', e=> { ptrs.delete(e.pointerId); lastPinch=0; });
cv.addEventListener('pointermove', e=>{
  if(mode!=='3d' || !ptrs.has(e.pointerId)) return;
  const p = ptrs.get(e.pointerId), dx=e.clientX-p.x, dy=e.clientY-p.y;
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size===1){ orbit.az -= dx*0.008; orbit.el = Math.max(0.05, Math.min(1.4, orbit.el+dy*0.006)); }
  else if(ptrs.size===2){
    const [a,b]=[...ptrs.values()], dist=Math.hypot(a.x-b.x,a.y-b.y);
    if(lastPinch) orbit.dist = Math.max(0.8, Math.min(6, orbit.dist*lastPinch/dist));
    lastPinch = dist;
  }
  placeCamera();
});
cv.addEventListener('wheel', e=>{ if(mode!=='3d') return; orbit.dist = Math.max(0.8, Math.min(6, orbit.dist*(1+e.deltaY*0.001))); placeCamera(); });

// ---------- Realidade Aumentada (WebXR + hit-test: Chrome no Android com ARCore) ----------
let mode = '3d', hitSource = null, xrSession = null;
const reticle = new THREE.Mesh(new THREE.RingGeometry(0.12,0.15,32).rotateX(-Math.PI/2), new THREE.MeshBasicMaterial({color:0xf2b705}));
reticle.matrixAutoUpdate = false; reticle.visible = false; scene.add(reticle);
function setMode(m){ mode = m; document.body.classList.toggle('run', m==='xr'); grid.visible = (m==='3d'); reticle.visible = false; }
function backTo3D(){ setMode('3d'); root.visible = true; root.position.set(0,0,0); placeCamera(); }

async function checkAR(){
  let t;
  if(!navigator.xr) t = 'Este navegador não tem WebXR. Abra esta página no Chrome do Android.';
  else{
    const ok = await navigator.xr.isSessionSupported('immersive-ar').catch(()=>false);
    t = ok ? 'Pronto: toque em "Iniciar RA", aponte para o chão e toque para colocar a mesa.'
           : 'RA indisponível: instale ou atualize "Serviços do Google Play para RA" na Play Store e use o Chrome.';
  }
  if(window.top !== window.self) t += ' Esta página está dentro de um quadro (claude.ai), que pode bloquear a RA. Se falhar, hospede o arquivo fora dele.';
  status.textContent = t;
}

$('arBtn').onclick = async ()=>{
  try{
    xrSession = await navigator.xr.requestSession('immersive-ar',{
      requiredFeatures:['hit-test'], optionalFeatures:['dom-overlay'], domOverlay:{root:ui}});
    renderer.xr.setReferenceSpaceType('local');
    await renderer.xr.setSession(xrSession);
    const viewer = await xrSession.requestReferenceSpace('viewer');
    hitSource = await xrSession.requestHitTestSource({space:viewer});
    setMode('xr'); root.visible = false;
    status.textContent = 'Mova o celular devagar para reconhecer o chão. Quando o anel amarelo aparecer, toque para colocar a mesa; toque de novo para mover.';
    xrSession.addEventListener('select', ()=>{
      if(reticle.visible){ root.position.setFromMatrixPosition(reticle.matrix); root.visible = true; }
    });
    xrSession.addEventListener('end', ()=>{ hitSource = null; xrSession = null; backTo3D(); status.textContent = 'RA encerrada.'; });
  }catch(err){
    xrSession = null;
    status.textContent = 'Não foi possível iniciar a RA: ' + err.message + '. Use o Chrome do Android com "Serviços do Google Play para RA"; se a página estiver no claude.ai, hospede-a fora dele.';
  }
};
$('exitBtn').onclick = ()=>{ if(xrSession) xrSession.end(); };

let ghost = false;                                   // tampo translúcido: deixa ver os braços da cadeira real através da mesa
$('tranBtn').onclick = ()=>{
  ghost = !ghost;
  [woodMat, legMat].forEach(m=>{ m.transparent = ghost; m.opacity = ghost ? 0.4 : 1; m.needsUpdate = true; });
  $('tranBtn').textContent = ghost ? 'Tampo sólido' : 'Tampo transparente';
};

renderer.setAnimationLoop((ts, frame)=>{
  if(mode==='xr' && frame && hitSource){
    const hits = frame.getHitTestResults(hitSource);
    if(hits.length){
      const pose = hits[0].getPose(renderer.xr.getReferenceSpace());
      reticle.visible = true; reticle.matrix.fromArray(pose.transform.matrix);
    } else reticle.visible = false;
  }
  renderer.render(scene, camera);
});
addEventListener('resize', ()=>{
  renderer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
});

rebuild(); placeCamera(); checkAR();
</script>
</body>
</html>
